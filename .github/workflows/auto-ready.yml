name: auto-ready

# Automatically converts draft PRs targeting next-feat / next-fix to ready_for_review
# once required checks (branch-tag-adjudication, Test) pass.

on:
  workflow_run:
    workflows: ["branch-tag-adjudication", "Test"]
    types: [completed]
    branches:
      - next-feat
      - next-fix

permissions:
  pull-requests: write
  contents: read

jobs:
  auto-ready:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Check PR status and set to ready if draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          set -euo pipefail
          if [ -z "$PR_NUMBER" ]; then
            echo "No associated PR found in workflow_run event — skipping."
            exit 0
          fi

          IS_DRAFT=$(gh pr view "$PR_NUMBER" -R "$REPO" --json isDraft --jq '.isDraft')
          if [ "$IS_DRAFT" = "true" ]; then
            echo "PR #$PR_NUMBER is draft. Converting to ready for review..."
            gh pr ready "$PR_NUMBER" -R "$REPO"
            echo "Successfully converted PR #$PR_NUMBER to ready_for_review."
          else
            echo "PR #$PR_NUMBER is already ready for review or not draft."
          fi
